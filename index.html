<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🐄 Farm Drag Game</title>
<style>
body {
    margin:0;
    font-family:'Comic Sans MS', cursive;
    overflow:hidden;
    background: linear-gradient(#87ceeb 0%, #c1f0a6 60%);
}

/* sky + clouds */
.cloud {
    position:absolute;
    width:120px;
    height:60px;
    background:white;
    border-radius:50px;
    opacity:0.8;
    animation: moveCloud 20s linear infinite;
}

@keyframes moveCloud {
    from { left:-150px; }
    to { left:100%; }
}

/* grass */
.grass {
    position:absolute;
    bottom:0;
    width:100%;
    height:120px;
    background:#6ecf68;
}

/* animals (emoji animated) */
.animal {
    position:absolute;
    font-size:40px;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

h1 {
    text-align:center;
    color:#ff6f61;
}

.container {
    display:flex;
    justify-content:space-around;
    margin-top:80px;
}

.box {
    width:30%;
    min-height:220px;
    background:white;
    border-radius:20px;
    padding:10px;
    box-shadow:0 6px 12px rgba(0,0,0,0.2);
}

.word {
    display:inline-block;
    background:#ffd166;
    padding:10px;
    margin:5px;
    border-radius:15px;
    cursor:grab;
}

#wordBank {
    position:absolute;
    bottom:130px;
    width:100%;
    text-align:center;
}
</style>
</head>
<body>

<!-- clouds -->
<div class="cloud" style="top:50px; animation-duration:25s"></div>
<div class="cloud" style="top:120px; animation-duration:18s"></div>

<!-- animals -->
<div class="animal" style="bottom:100px; left:10%">🐄</div>
<div class="animal" style="bottom:100px; left:40%">🐑</div>
<div class="animal" style="bottom:100px; left:70%">🦆</div>

<h1>🐄 Drag & Drop Farm Game</h1>

<div class="container">
    <div class="box" ondragover="allowDrop(event)" ondrop="drop(event,'animals')">
        <h3>🐾 Animals</h3>
        <div id="animals"></div>
    </div>
    <div class="box" ondragover="allowDrop(event)" ondrop="drop(event,'actions')">
        <h3>🏃 Actions</h3>
        <div id="actions"></div>
    </div>
    <div class="box" ondragover="allowDrop(event)" ondrop="drop(event,'adjectives')">
        <h3>🎨 Descriptions</h3>
        <div id="adjectives"></div>
    </div>
</div>

<div id="wordBank"></div>
<div class="grass"></div>

<script>
let words = [
 {text:"Sheep", type:"animals"},
 {text:"Cow", type:"animals"},
 {text:"Duck", type:"animals"},
 {text:"Run", type:"actions"},
 {text:"Jump", type:"actions"},
 {text:"Soft", type:"adjectives"},
 {text:"Big", type:"adjectives"}
];

function speak(word){
 let u=new SpeechSynthesisUtterance(word);
 u.lang='en-US';
 speechSynthesis.speak(u);
}

const bank=document.getElementById('wordBank');

words.forEach((w,i)=>{
 let div=document.createElement('div');
 div.className='word';
 div.innerText=w.text;
 div.draggable=true;
 div.id='word'+i;
 div.ondragstart=(e)=>drag(e,w);
 div.onclick=()=>speak(w.text);
 bank.appendChild(div);
});

let currentWord=null;

function drag(ev,word){
 ev.dataTransfer.setData("text", ev.target.id);
 currentWord=word;
}

function allowDrop(ev){ ev.preventDefault(); }

function drop(ev,category){
 ev.preventDefault();
 let id=ev.dataTransfer.getData("text");
 let el=document.getElementById(id);

 if(currentWord.type===category){
   ev.target.appendChild(el);
   let star=document.createElement('div');
   star.innerText='⭐';
   star.style.position='fixed';
   star.style.left=ev.clientX+'px';
   star.style.top=ev.clientY+'px';
   document.body.appendChild(star);
   setTimeout(()=>star.remove(),800);
 } else {
   alert('❌ Try again');
 }
}
</script>

</body>
</html>
