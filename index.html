<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🐄 Cute Farm Word Game</title>
<style>
body {
    font-family: 'Comic Sans MS', cursive;
    text-align: center;
    background: linear-gradient(#e6f7ff, #fff);
}

h1 {
    color: #ff7f50;
}

.container {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
}

.box {
    width: 30%;
    min-height: 220px;
    border-radius: 20px;
    padding: 10px;
    background: #ffffff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.box:hover {
    transform: scale(1.05);
}

.word {
    display: inline-block;
    background: #ffd966;
    padding: 8px 12px;
    margin: 5px;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.2s;
}

.word:hover {
    background: #ffb347;
    transform: scale(1.1);
}

.selected {
    background: #ff7f50 !important;
    color: white;
}

.score {
    font-size: 20px;
    margin-top: 10px;
}
</style>
</head>
<body>

<h1>🐄 Farm Word Game 🐤</h1>
<p>Click a word → Click a box!</p>

<div class="score">⭐ Score: <span id="score">0</span></div>

<div class="container">
    <div class="box" onclick="dropWord('animals')">
        <h3>🐾 Animals</h3>
        <div id="animals"></div>
    </div>

    <div class="box" onclick="dropWord('actions')">
        <h3>🏃 Actions</h3>
        <div id="actions"></div>
    </div>

    <div class="box" onclick="dropWord('adjectives')">
        <h3>🎨 Descriptions</h3>
        <div id="adjectives"></div>
    </div>
</div>

<div id="wordBank"></div>

<script>
let selectedWord = null;
let score = 0;

const words = [
    // animals
    {text:"Sheep", type:"animals"},
    {text:"Lamb", type:"animals"},
    {text:"Cow", type:"animals"},
    {text:"Calf", type:"animals"},
    {text:"Chicken", type:"animals"},
    {text:"Duck", type:"animals"},
    {text:"Goose", type:"animals"},
    {text:"Insect", type:"animals"},
    {text:"Pig", type:"animals"},
    {text:"Horse", type:"animals"},

    // actions
    {text:"Feed", type:"actions"},
    {text:"Chomp", type:"actions"},
    {text:"Mix", type:"actions"},
    {text:"Leap", type:"actions"},
    {text:"Skip", type:"actions"},
    {text:"Waddle", type:"actions"},
    {text:"Giggle", type:"actions"},
    {text:"Pull out", type:"actions"},
    {text:"Run", type:"actions"},
    {text:"Jump", type:"actions"},

    // adjectives
    {text:"Sweet", type:"adjectives"},
    {text:"Slimy", type:"adjectives"},
    {text:"Beautiful", type:"adjectives"},
    {text:"Soft", type:"adjectives"},
    {text:"Brown", type:"adjectives"},
    {text:"Huge", type:"adjectives"},
    {text:"Funny", type:"adjectives"},
    {text:"Fresh", type:"adjectives"},
    {text:"Gentle", type:"adjectives"},
    {text:"Clean", type:"adjectives"}
];

const wordBank = document.getElementById("wordBank");

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

shuffle(words);

words.forEach((w) => {
    const div = document.createElement("div");
    div.className = "word";
    div.innerText = w.text;
    div.onclick = () => selectWord(div, w);
    wordBank.appendChild(div);
});

function selectWord(element, word) {
    document.querySelectorAll(".word").forEach(w => w.classList.remove("selected"));
    element.classList.add("selected");
    selectedWord = {element, word};
}

function dropWord(category) {
    if (!selectedWord) return;

    if (selectedWord.word.type === category) {
        document.getElementById(category).appendChild(selectedWord.element);
        selectedWord.element.classList.remove("selected");
        selectedWord = null;
        score++;
        document.getElementById("score").innerText = score;
    } else {
        alert("Try again!");
    }
}
</script>

</body>
</html>
