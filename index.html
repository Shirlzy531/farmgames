<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word Sorting Game</title>
<style>
    body {
        font-family: Arial;
        text-align: center;
        background: #f0f8ff;
    }
    h1 {
        color: #333;
    }
    .container {
        display: flex;
        justify-content: space-around;
        margin-top: 20px;
    }
    .box {
        width: 30%;
        min-height: 200px;
        border: 3px dashed #aaa;
        border-radius: 10px;
        padding: 10px;
        background: #fff;
    }
    .word-bank {
        margin-top: 20px;
    }
    .word {
        display: inline-block;
        background: #87cefa;
        padding: 8px;
        margin: 5px;
        border-radius: 5px;
        cursor: pointer;
    }
    .selected {
        background: orange;
    }
</style>
</head>
<body>

<h1>🐄 Word Sorting Game 🐤</h1>
<p>Step 1: Click a word 👆</p>
<p>Step 2: Click the correct box 👇</p>

<div class="container">
    <div class="box" onclick="dropWord('animals')">
        <h3>🐾 Animals</h3>
        <div id="animals"></div>
    </div>

    <div class="box" onclick="dropWord('actions')">
        <h3>🏃 Actions</h3>
        <div id="actions"></div>
    </div>

    <div class="box" onclick="dropWord('adjectives')">
        <h3>🎨 Descriptions</h3>
        <div id="adjectives"></div>
    </div>
</div>

<div class="word-bank" id="wordBank"></div>

<script>
let selectedWord = null;

const words = [
    // animals
    {text:"Sheep", type:"animals"},
    {text:"Lamb", type:"animals"},
    {text:"Cow", type:"animals"},
    {text:"Calf", type:"animals"},
    {text:"Chicken", type:"animals"},
    {text:"Duck", type:"animals"},
    {text:"Goose", type:"animals"},
    {text:"Insect", type:"animals"},

    // actions
    {text:"Feed", type:"actions"},
    {text:"Chomp", type:"actions"},
    {text:"Mix", type:"actions"},
    {text:"Leap", type:"actions"},
    {text:"Skip", type:"actions"},
    {text:"Waddle", type:"actions"},
    {text:"Giggle", type:"actions"},
    {text:"Pull out", type:"actions"},

    // adjectives
    {text:"Sweet", type:"adjectives"},
    {text:"Slimy", type:"adjectives"},
    {text:"Beautiful", type:"adjectives"},
    {text:"Soft", type:"adjectives"},
    {text:"Brown", type:"adjectives"},
    {text:"Huge", type:"adjectives"},
    {text:"Funny", type:"adjectives"},
    {text:"Fresh", type:"adjectives"}
];

const wordBank = document.getElementById("wordBank");

words.forEach((w, index) => {
    const div = document.createElement("div");
    div.className = "word";
    div.innerText = w.text;
    div.onclick = () => selectWord(div, w);
    wordBank.appendChild(div);
});

function selectWord(element, word) {
    document.querySelectorAll(".word").forEach(w => w.classList.remove("selected"));
    element.classList.add("selected");
    selectedWord = {element, word};
}

function dropWord(category) {
    if (!selectedWord) {
        alert("Please select a word first!");
        return;
    }

    if (selectedWord.word.type === category) {
        document.getElementById(category).appendChild(selectedWord.element);
        selectedWord.element.classList.remove("selected");
        selectedWord = null;
        alert("✅ Correct!");
    } else {
        alert("❌ Try again!");
    }
}
</script>

</body>
</html>
