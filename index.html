<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🐄 Farm Ultimate Game</title>
<style>
body {
    margin:0;
    font-family:'Comic Sans MS', cursive;
    overflow:hidden;
    background: linear-gradient(#87ceeb 0%, #c1f0a6 60%);
}

h1 { text-align:center; color:#ff6f61; }

.container {
    display:flex;
    justify-content:space-around;
    margin-top:80px;
}

.box {
    width:30%;
    min-height:220px;
    background:white;
    border-radius:20px;
    padding:10px;
}

.word {
    display:inline-block;
    background:#ffd166;
    padding:10px;
    margin:5px;
    border-radius:15px;
    cursor:grab;
}

#wordBank { position:absolute; bottom:120px; width:100%; text-align:center; }

.animal {
    position:absolute;
    font-size:40px;
    cursor:pointer;
}

.trophy {
    position:fixed;
    top:40%;
    left:40%;
    font-size:80px;
    animation: pop 1s;
}

@keyframes pop {
    0%{transform:scale(0);} 
    100%{transform:scale(1);} 
}
</style>
</head>
<body>

<h1>🐄 Farm Ultimate Game 🐤</h1>
<div id="level">Level 1</div>

<!-- animals clickable -->
<div class="animal" style="bottom:100px; left:20%" onclick="playSound('cow')">🐄</div>
<div class="animal" style="bottom:100px; left:50%" onclick="playSound('duck')">🦆</div>
<div class="animal" style="bottom:100px; left:75%" onclick="playSound('sheep')">🐑</div>

<div class="container">
    <div class="box" ondragover="allowDrop(event)" ondrop="drop(event,'animals')">
        <h3>Animals</h3><div id="animals"></div>
    </div>
    <div class="box" ondragover="allowDrop(event)" ondrop="drop(event,'actions')">
        <h3>Actions</h3><div id="actions"></div>
    </div>
    <div class="box" ondragover="allowDrop(event)" ondrop="drop(event,'adjectives')">
        <h3>Descriptions</h3><div id="adjectives"></div>
    </div>
</div>

<div id="wordBank"></div>

<script>
let level=1;
let correctCount=0;
let currentWord=null;

const levels={
1:[{text:"Sheep",type:"animals"},{text:"Run",type:"actions"},{text:"Soft",type:"adjectives"}],
2:[{text:"Duck",type:"animals"},{text:"Jump",type:"actions"},{text:"Funny",type:"adjectives"}],
3:[{text:"Cow",type:"animals"},{text:"Chomp",type:"actions"},{text:"Huge",type:"adjectives"}]
};

function loadLevel(){
 document.getElementById('wordBank').innerHTML='';
 document.getElementById('animals').innerHTML='';
 document.getElementById('actions').innerHTML='';
 document.getElementById('adjectives').innerHTML='';
 correctCount=0;
 document.getElementById('level').innerText='Level '+level;

 levels[level].forEach((w,i)=>{
  let div=document.createElement('div');
  div.className='word';
  div.innerText=w.text;
  div.id='w'+i;
  div.draggable=true;
  div.onclick=()=>speak(w.text);
  div.ondragstart=(e)=>{currentWord=w;e.dataTransfer.setData('id',div.id)};
  document.getElementById('wordBank').appendChild(div);
 });
}

function speak(word){
 let u=new SpeechSynthesisUtterance(word);
 u.lang='en-US';
 speechSynthesis.speak(u);
}

function playSound(animal){
 let sounds={
  cow:'moo',
  duck:'quack',
  sheep:'baa'
 };
 let u=new SpeechSynthesisUtterance(sounds[animal]);
 speechSynthesis.speak(u);
}

function allowDrop(e){e.preventDefault();}

function drop(e,category){
 e.preventDefault();
 let id=e.dataTransfer.getData('id');
 let el=document.getElementById(id);

 if(currentWord.type===category){
  e.target.appendChild(el);
  correctCount++;

  if(correctCount===levels[level].length){
    showTrophy();
    if(level<3){level++; setTimeout(loadLevel,1000);} 
  }

 } else {
  // bounce back
  el.style.position='relative';
  el.style.left='-20px';
  setTimeout(()=>{el.style.left='0px'},200);
 }
}

function showTrophy(){
 let t=document.createElement('div');
 t.className='trophy';
 t.innerText='🏆';
 document.body.appendChild(t);
 setTimeout(()=>t.remove(),1000);
}

loadLevel();
</script>

</body>
</html>
