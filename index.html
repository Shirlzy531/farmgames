<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🐄 Farm Adventure Game</title>
<style>
body {
    font-family: 'Comic Sans MS', cursive;
    text-align: center;
    margin:0;
    background: linear-gradient(#a8e6cf, #dcedc1);
}

h1 { color:#ff6f61; }

.container {
    display:flex;
    justify-content:space-around;
    margin:20px;
}

.box {
    width:30%;
    min-height:220px;
    border-radius:20px;
    background:#fff;
    box-shadow:0 6px 12px rgba(0,0,0,0.15);
    padding:10px;
    transition:0.3s;
}

.box:hover { transform:scale(1.05); }

.word {
    display:inline-block;
    background:#ffd166;
    padding:10px 14px;
    margin:6px;
    border-radius:20px;
    cursor:pointer;
    transition:0.2s;
}

.word:hover { transform:scale(1.1); background:#ffb347; }
.selected { background:#ff6f61 !important; color:white; }

#wordBank { margin-top:20px; }

.score, .level {
    font-size:20px;
    margin:5px;
}

/* animation */
@keyframes pop {
  0%{transform:scale(1);} 
  50%{transform:scale(1.4);} 
  100%{transform:scale(1);} 
}
.correct { animation: pop 0.4s; }

.star {
    position:fixed;
    font-size:24px;
    animation: float 1s ease-out forwards;
}

@keyframes float {
  from {opacity:1; transform:translateY(0);} 
  to {opacity:0; transform:translateY(-100px);} 
}
</style>
</head>
<body>

<h1>🐄 Farm Adventure 🐤</h1>
<div class="level">Level: <span id="level">1</span></div>
<div class="score">⭐ Score: <span id="score">0</span></div>

<div class="container">
    <div class="box" onclick="dropWord('animals')">
        <h3>🐾 Animals</h3>
        <div id="animals"></div>
    </div>

    <div class="box" onclick="dropWord('actions')">
        <h3>🏃 Actions</h3>
        <div id="actions"></div>
    </div>

    <div class="box" onclick="dropWord('adjectives')">
        <h3>🎨 Descriptions</h3>
        <div id="adjectives"></div>
    </div>
</div>

<div id="wordBank"></div>

<script>
let selectedWord = null;
let score = 0;
let level = 1;

const allWords = {
1:[
    {text:"Sheep", type:"animals"},
    {text:"Cow", type:"animals"},
    {text:"Duck", type:"animals"},
    {text:"Run", type:"actions"},
    {text:"Jump", type:"actions"},
    {text:"Soft", type:"adjectives"},
    {text:"Big", type:"adjectives"}
],
2:[
    {text:"Lamb", type:"animals"},
    {text:"Chicken", type:"animals"},
    {text:"Goose", type:"animals"},
    {text:"Skip", type:"actions"},
    {text:"Waddle", type:"actions"},
    {text:"Beautiful", type:"adjectives"},
    {text:"Funny", type:"adjectives"}
],
3:[
    {text:"Calf", type:"animals"},
    {text:"Insect", type:"animals"},
    {text:"Horse", type:"animals"},
    {text:"Giggle", type:"actions"},
    {text:"Chomp", type:"actions"},
    {text:"Slimy", type:"adjectives"},
    {text:"Huge", type:"adjectives"}
]
};

function speak(word){
    let utter = new SpeechSynthesisUtterance(word);
    utter.lang = 'en-US';
    speechSynthesis.speak(utter);
}

function loadLevel(){
    document.getElementById('wordBank').innerHTML='';
    let words = allWords[level];
    words.forEach(w=>{
        let div=document.createElement('div');
        div.className='word';
        div.innerText=w.text;
        div.onclick=()=>{
            speak(w.text);
            selectWord(div,w);
        };
        document.getElementById('wordBank').appendChild(div);
    });
}

function selectWord(el,w){
    document.querySelectorAll('.word').forEach(x=>x.classList.remove('selected'));
    el.classList.add('selected');
    selectedWord={element:el,word:w};
}

function dropWord(category){
    if(!selectedWord) return;

    if(selectedWord.word.type===category){
        document.getElementById(category).appendChild(selectedWord.element);
        selectedWord.element.classList.remove('selected');
        selectedWord.element.classList.add('correct');

        // star animation
        let star=document.createElement('div');
        star.className='star';
        star.innerText='⭐';
        star.style.left=Math.random()*80+'%';
        star.style.top='50%';
        document.body.appendChild(star);
        setTimeout(()=>star.remove(),1000);

        score++;
        document.getElementById('score').innerText=score;

        if(score % 7 ===0 && level<3){
            level++;
            document.getElementById('level').innerText=level;
            alert('🎉 Level Up!');
            loadLevel();
        }

        selectedWord=null;
    } else {
        alert('❌ Try again!');
    }
}

loadLevel();
</script>

</body>
</html>
